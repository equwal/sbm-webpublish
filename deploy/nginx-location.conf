# Example for nginx. Add this block to the server block of the site.
# nginx continues to serve the static site. It sends only /links/ to
# sbm-webpublish. Serve the site over HTTPS: the admin page uses basic auth.
location /links/ {
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
}
