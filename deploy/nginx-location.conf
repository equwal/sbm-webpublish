# nginx snippet for sbm-webpublish. deploy.sh installs it as
# /etc/nginx/snippets/sbm-webpublish.conf. Include it in the HTTPS server
# block of the site:
#
#     include snippets/sbm-webpublish.conf;
#
# nginx continues to serve the static site. It sends only /links/ to
# sbm-webpublish. Serve the site over HTTPS: the admin page uses basic auth.
# "^~" stops the search for a regular expression location, so that a
# location such as "~ \.xml$" of the site does not take /links/atom.xml.
location ^~ /links/ {
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
}

# The page of the links includes /links/list.html with SSI. Change the path
# to the path of your page. This location gets the root of the server block.
location = /links.html {
    ssi on;
}
